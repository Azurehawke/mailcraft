[package]
name = "mailcraft-android"
description = "MailCraft on Android tablets (NativeActivity; build with packaging/android/build-apk.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# Loaded by Android's NativeActivity as libmailcraft_android.so.
crate-type = ["cdylib"]

# Not the workspace lints: `unsafe_code = "forbid"` can't be relaxed per item, and Android needs a
# few unsafe-attributed items here (the exported `android_main`, `set_var` before any thread
# starts, and handing the JavaVM and activity pointers Android gives to the JNI). Everything else
# in the crate stays safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "android")'.dependencies]
mailcraft-model = { workspace = true }
mailcraft-engine = { workspace = true }
mailcraft-net = { workspace = true }
mailcraft-ui-egui = { workspace = true }
mailcraft-control-key = { workspace = true }
# No accesskit: eframe offers it on Android only with GameActivity, which needs Java and Gradle.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
# The AndroidApp handle (the same winit as eframe's own, with the Android activity).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
log = { workspace = true }
android_logger = "0.15"
# The status bar's height, asked of Android's own resources (the same jni that android-activity uses).
jni = "0.22"
sha2 = { workspace = true }
